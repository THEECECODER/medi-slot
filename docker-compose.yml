services:
  postgres:
    image: postgres:16
    container_name: medislot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medislot
      POSTGRES_PASSWORD: medislot
      POSTGRES_DB: medislot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: